# Production overrides
# Spring loads application.properties as the base, then overrides with this file when SPRING_PROFILES_ACTIVE=prod

cors.allowed.origins=https://pokemon-team-builder-hooks.vercel.app

# Database credentials from environment variables (set in AWS EB config)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT secret from environment (set in AWS EB config)
jwt.secret=${JWT_SECRET}

# Server port — AWS Elastic Beanstalk's nginx proxy forwards requests to port 5000
server.port=5000